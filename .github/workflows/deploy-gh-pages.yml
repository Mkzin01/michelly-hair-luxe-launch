name: Publicar site no GitHub Pages

# Corre a cada envio para main e também a pedido, no separador Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões necessárias para o GitHub Pages publicar a partir do Actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Se houver dois envios seguidos, deixa terminar o que já está a publicar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Gerar o site estático
        env:
          # O GitHub Pages serve o site em https://<utilizador>.github.io/<repo>/
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          SITE_URL: https://${{ github.repository_owner }}.github.io
        run: bun run export:static

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
